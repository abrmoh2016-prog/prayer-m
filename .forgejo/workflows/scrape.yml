name: scrape-casa
on:
  schedule:
    - cron: "0 23 * * *"   # täglich 00:00 UTC
  workflow_dispatch:

jobs:
  scrape:
    runs-on: docker
    steps:
      - uses: actions/checkout@v4
      - run: pip install beautifulsoup4
      - run: python3 scrape_casa.py
      - run: |
          git config user.name  "bot"
          git config user.email "bot@example.com"
          git add casa/
          git commit -m "update casa $(date -I)" || true
          git push
